<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Mastery Dashboard</title>
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #92fe9d;
            --accent: #ffd700;
            --error: #ff416c;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e);
            margin: 0; 
            color: white;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            padding: 10px;
        }

        /* 3D TITLE */
        .portal-title {
            font-size: clamp(1.2rem, 6vw, 2.5rem);
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            margin: 10px 0;
            color: #fff;
            text-shadow: 0 0 10px var(--primary);
        }

        /* GAUGE DASHBOARD SECTION */
        .dashboard {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 10px;
        }

        .gauge-container {
            position: relative;
            width: 140px;
            height: 80px;
            overflow: hidden; /* Clips the bottom half of the circle */
        }

        .gauge-svg {
            width: 140px;
            height: 140px;
            transform: rotate(-180deg);
        }

        .gauge-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 12;
        }

        .gauge-fill {
            fill: none;
            stroke-width: 12;
            stroke-dasharray: 220; /* Half of the circumference */
            stroke-dashoffset: 220;
            transition: stroke-dashoffset 0.5s ease-out, stroke 0.5s;
            stroke-linecap: round;
        }

        .gauge-label {
            position: absolute;
            bottom: 5px;
            width: 100%;
            text-align: center;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .gauge-value {
            position: absolute;
            bottom: 22px;
            width: 100%;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* MAIN CONTAINER (70% VISIBILITY) */
        .container { 
            width: 100%; 
            max-width: 500px; 
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px; 
            border-radius: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            text-align: center;
            box-sizing: border-box;
        }

        .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .coin-display { font-size: 1.1rem; color: var(--accent); font-weight: bold; }

        /* MATH AREA */
        .math-area { 
            font-family: 'Courier New', monospace; 
            font-size: clamp(1.8rem, 8vw, 2.8rem); 
            font-weight: bold; 
            text-align: right; 
            margin: 10px 0; 
        }

        .digit-row { display: flex; justify-content: flex-end; }
        
        .carry-box { 
            width: 22px; height: 22px; border: 1px dashed var(--primary); 
            margin-left: 3px; color: var(--primary); border-radius: 4px; 
            font-size: 13px; text-align: center;
        }

        .digit-input { 
            width: clamp(32px, 10vw, 48px); 
            height: clamp(45px, 12vw, 60px); 
            font-size: 1.8rem; 
            text-align: center; 
            border: 2px solid rgba(255,255,255,0.2); 
            border-radius: 10px; 
            background: rgba(0,0,0,0.5); 
            color: white; 
            margin: 0 2px;
        }

        .btn-submit { 
            width: 100%; padding: 16px; font-size: 1.2rem; font-weight: bold; color: white; 
            background: linear-gradient(45deg, var(--primary), #3a7bd5); 
            border: none; border-radius: 15px; cursor: pointer; margin-top: 20px;
        }

        .developer-credit { 
            margin-top: auto; padding: 15px; font-size: 0.85rem; 
            color: rgba(255,255,255,0.5); text-align: center; 
        }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1 class="portal-title">Math Mastery Dashboard</h1>

    <div class="dashboard">
        <div class="gauge-container">
            <svg class="gauge-svg">
                <circle class="gauge-bg" cx="70" cy="70" r="60"></circle>
                <circle id="timer-fill" class="gauge-fill" cx="70" cy="70" r="60" style="stroke: var(--primary);"></circle>
            </svg>
            <div class="gauge-value" id="timer-text">60</div>
            <div class="gauge-label">Seconds</div>
        </div>

        <div class="gauge-container">
            <svg class="gauge-svg">
                <circle class="gauge-bg" cx="70" cy="70" r="60"></circle>
                <circle id="score-fill" class="gauge-fill" cx="70" cy="70" r="60" style="stroke: var(--secondary);"></circle>
            </svg>
            <div class="gauge-value" id="score-text">0</div>
            <div class="gauge-label">Correct</div>
        </div>
    </div>

    <div class="container">
        <div class="header-box">
            <div id="q-label" style="font-size: 0.9rem; opacity: 0.8;">Quest: 1/100</div>
            <div class="coin-display">💰 <span id="coin-count">0</span> Coins</div>
        </div>

        <div id="game-area">
            <div id="carry-container" class="digit-row"></div>
            <div class="math-area">
                <div id="num1">000000</div>
                <div id="op-num2">- 000000</div>
                <div style="border-top: 4px solid #fff; margin: 8px 0; box-shadow: 0 0 10px var(--primary);"></div>
                <div id="answer-container" class="digit-row"></div>
            </div>
        </div>

        <div id="feedback" style="height: 1.5rem; margin: 15px 0; font-weight: bold; font-size: 1.1rem;"></div>
        <button class="btn-submit" id="submit-btn" onclick="checkAnswer()">SUBMIT ANSWER</button>
        <button class="btn-submit hidden" id="next-btn" onclick="nextQuestion()">NEXT CHALLENGE ➔</button>
    </div>

    <div class="developer-credit">
        Designed and Developed by <br><b>Mohammad Ashraf Rather</b>
    </div>

<script>
    let currentStep = 0, coins = 0, correctCount = 0, currentCorrectAns = 0;
    let timer, timeLeft = 60;
    const maxDash = 188; // Adjust based on SVG stroke-dasharray for semi-circle

    function updateGauges() {
        // Timer Gauge Logic
        const timerFill = document.getElementById('timer-fill');
        const timerOffset = maxDash - (timeLeft / 60) * maxDash;
        timerFill.style.strokeDashoffset = timerOffset;
        document.getElementById('timer-text').innerText = timeLeft;

        // Score Gauge Logic (Based on 100 questions)
        const scoreFill = document.getElementById('score-fill');
        const scoreOffset = maxDash - (correctCount / 100) * maxDash;
        scoreFill.style.strokeDashoffset = scoreOffset;
        document.getElementById('score-text').innerText = correctCount;
    }

    function startTimer() {
        clearInterval(timer);
        timeLeft = 60;
        updateGauges();
        timer = setInterval(() => {
            timeLeft--;
            updateGauges();
            if (timeLeft <= 0) {
                clearInterval(timer);
                feedback.innerHTML = '<span style="color:var(--error);">⏰ TIME OUT!</span>';
                setTimeout(nextQuestion, 1500);
            }
        }, 1000);
    }

    function generateQuestion() {
        startTimer();
        document.getElementById('feedback').innerHTML = "";
        document.getElementById('submit-btn').classList.remove('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        
        const carryRow = document.getElementById('carry-container');
        const answerRow = document.getElementById('answer-container');
        carryRow.innerHTML = ""; answerRow.innerHTML = "";

        let n1, n2, op, digits;
        if (currentStep < 50) {
            n1 = Math.floor(Math.random() * 800000) + 200000;
            n2 = Math.floor(Math.random() * 100000) + 100000;
            op = "-"; currentCorrectAns = n1 - n2; digits = 6;
        } else {
            n1 = Math.floor(Math.random() * 90) + 10;
            n2 = (currentStep < 75) ? Math.floor(Math.random() * 8) + 2 : Math.floor(Math.random() * 90) + 10;
            op = "×"; currentCorrectAns = n1 * n2; digits = currentCorrectAns.toString().length;
        }

        document.getElementById('num1').innerText = n1.toLocaleString();
        document.getElementById('op-num2').innerText = `${op} ${n2.toLocaleString()}`;

        for (let i = 0; i < digits; i++) {
            carryRow.innerHTML += `<div class="carry-box" contenteditable="true"></div>`;
            answerRow.innerHTML += `<input type="number" class="digit-input" oninput="if(this.value.length>1) this.value=this.value.slice(-1)">`;
        }
        setTimeout(() => document.querySelector('.digit-input')?.focus(), 300);
    }

    function checkAnswer() {
        let userAns = "";
        document.querySelectorAll('.digit-input').forEach(inp => userAns += inp.value);
        if (userAns === "") return;

        clearInterval(timer);
        if (parseInt(userAns) === currentCorrectAns) {
            coins += 5;
            correctCount++;
            document.getElementById('coin-count').innerText = coins;
            document.getElementById('feedback').innerHTML = '<span style="color:var(--secondary);">🌟 FANTASTIC! +5 COINS</span>';
            document.getElementById('submit-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
            updateGauges();
        } else {
            document.getElementById('feedback').innerHTML = '<span style="color:var(--error);">❌ WRONG! TRY NEXT</span>';
            setTimeout(nextQuestion, 1500);
        }
    }

    function nextQuestion() {
        currentStep++;
        if (currentStep < 100) {
            document.getElementById('q-label').innerText = `Quest: ${currentStep + 1}/100`;
            generateQuestion();
        } else {
            clearInterval(timer);
            document.getElementById('game-area').innerHTML = "<h2>🏁 GRAND FINALE REACHED!</h2>";
        }
    }

    generateQuestion();
</script>
</body>
</html>
