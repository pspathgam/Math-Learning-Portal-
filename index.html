<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Mastery Portal</title>
    <style>
        :root {
            --primary: #007bff;
            --success: #28a745;
            --error: #dc3545;
            --bg: #f8f9fa;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            padding: 20px; 
            color: #333;
        }

        .container { 
            max-width: 1100px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }

        .header-box { 
            position: sticky; 
            top: 10px; 
            background: white; 
            padding: 20px; 
            border-bottom: 4px solid var(--primary); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 1000; 
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .coin-display { 
            font-size: 1.8em; 
            font-weight: bold; 
            color: #d4af37; 
            background: #fff9e6;
            padding: 10px 20px;
            border-radius: 50px;
            border: 2px solid #f1c40f;
        }

        h2 { 
            color: var(--primary); 
            margin-top: 50px; 
            font-size: 1.8em;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 25px; 
            margin-top: 30px; 
        }

        /* Question Card Design */
        .question-card { 
            background: #ffffff; 
            border: 2px solid #e0e0e0; 
            padding: 25px; 
            border-radius: 15px; 
            position: relative;
            transition: transform 0.2s;
        }

        .question-card:hover { transform: translateY(-5px); border-color: var(--primary); }

        .math-block {
            font-family: 'Courier New', monospace;
            font-size: 2.2em; /* Large Readable Digits */
            font-weight: bold;
            text-align: right;
            line-height: 1.2;
            letter-spacing: 4px;
        }

        /* Carry Boxes */
        .carry-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 5px;
            height: 25px;
        }

        .carry-box {
            width: 20px;
            height: 20px;
            border: 1px dashed #bbb;
            margin-left: 4px;
            font-size: 14px;
            text-align: center;
            line-height: 20px;
            color: var(--primary);
            border-radius: 3px;
        }

        .line { border-top: 4px solid #333; margin: 10px 0; }

        /* Digit Boxes for Answers */
        .answer-row {
            display: flex;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 10px;
        }

        .digit-input {
            width: 35px;
            height: 45px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        .digit-input:focus {
            border-color: var(--primary);
            outline: none;
            background-color: #f0f7ff;
        }

        .correct .digit-input { background-color: #d4edda; border-color: var(--success); }
        .wrong .digit-input { background-color: #f8d7da; border-color: var(--error); }

        .btn-submit { 
            display: block; 
            width: 280px; 
            height: 70px; 
            margin: 60px auto; 
            font-size: 1.4em; 
            font-weight: bold; 
            color: white; 
            background: var(--success); 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
            transition: 0.3s;
        }

        .btn-submit:hover { background: #218838; transform: scale(1.05); }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .math-block { font-size: 1.8em; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <h1>🚀 Math Portal</h1>
        <div class="coin-display">💰 <span id="coin-count">0</span> Coins</div>
    </div>

    <h2>1. 6-Digit Subtraction Challenge</h2>
    <div id="sub-grid" class="grid"></div>

    <h2>2. Multiplication Mastery (Level 1 & 2)</h2>
    <div id="mult-grid" class="grid"></div>

    <button class="btn-submit" onclick="checkAnswers()">SUBMIT & COLLECT COINS</button>
</div>

<script>
    const subGrid = document.getElementById('sub-grid');
    const multGrid = document.getElementById('mult-grid');
    const coinDisplay = document.getElementById('coin-count');
    
    let subAnswers = [];
    let multAnswers = [];

    function createDigitInputs(count, type, index) {
        let html = '<div class="answer-row">';
        for (let i = 0; i < count; i++) {
            html += `<input type="text" maxlength="1" class="digit-input ${type}-input-${index}">`;
        }
        html += '</div>';
        return html;
    }

    function generate() {
        // Subtraction (6-digit)
        for (let i = 0; i < 50; i++) {
            let n1 = Math.floor(Math.random() * 800000) + 200000;
            let n2 = Math.floor(Math.random() * 100000) + 100000;
            subAnswers.push(n1 - n2);
            
            subGrid.innerHTML += `
                <div class="question-card" id="sub-card-${i}">
                    <div class="carry-row">${'<div class="carry-box" contenteditable="true"></div>'.repeat(6)}</div>
                    <div class="math-block">
                        ${n1}<br>
                        - ${n2}
                    </div>
                    <div class="line"></div>
                    ${createDigitInputs(6, 'sub', i)}
                </div>`;
        }

        // Multiplication
        for (let i = 0; i < 50; i++) {
            let n1, n2, digits;
            if (i < 25) { n1 = Math.floor(Math.random()*90)+10; n2 = Math.floor(Math.random()*8)+2; digits = 3; }
            else { n1 = Math.floor(Math.random()*90)+10; n2 = Math.floor(Math.random()*90)+10; digits = 4; }
            multAnswers.push(n1 * n2);

            multGrid.innerHTML += `
                <div class="question-card" id="mult-card-${i}">
                    <div class="carry-row">${'<div class="carry-box" contenteditable="true"></div>'.repeat(digits)}</div>
                    <div class="math-block">
                        ${n1}<br>
                        &times; ${n2}
                    </div>
                    <div class="line"></div>
                    ${createDigitInputs(digits, 'mult', i)}
                </div>`;
        }
    }

    function checkAnswers() {
        let totalCorrect = 0;

        // Validation logic
        const checkSection = (answersArray, type, count) => {
            for (let i = 0; i < count; i++) {
                const inputs = document.querySelectorAll(`.${type}-input-${i}`);
                let userAns = "";
                inputs.forEach(inp => userAns += inp.value);
                
                const card = document.getElementById(`${type}-card-${i}`);
                if (parseInt(userAns) === answersArray[i]) {
                    totalCorrect++;
                    card.classList.add('correct');
                    card.classList.remove('wrong');
                } else if (userAns !== "") {
                    card.classList.add('wrong');
                    card.classList.remove('correct');
                }
            }
        };

        checkSection(subAnswers, 'sub', 50);
        checkSection(multAnswers, 'mult', 50);

        let coins = totalCorrect * 5;
        coinDisplay.innerText = coins;
        window.scrollTo({top: 0, behavior: 'smooth'});
        alert(`Finished! Correct: ${totalCorrect} | Coins Earned: ${coins}`);
    }

    generate();
</script>
</body>
</html>
