<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math World 3D: Ultimate Quest</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { 
            --primary: #00d2ff; 
            --secondary: #00ff88; 
            --accent: #ffd700; 
            --bg: #1a1a2e;
            --card-bg: #16213e;
            --text: #ffffff; 
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            margin: 0; color: var(--text); 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; overflow-x: hidden;
        }

        .main-wrapper { perspective: 1000px; width: 95%; max-width: 500px; margin-top: 10px; box-sizing: border-box; }
        .container { 
            background: rgba(255,255,255,0.05); padding: 25px; border-radius: 30px; 
            border: 1px solid rgba(255,255,255,0.1); transform: rotateX(3deg);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); transition: transform 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .container:hover { transform: rotateX(0deg); }

        .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; width: 100%; }
        .gauge-box { text-align: center; }
        .gauge {
            height: 45px; border: 4px solid #333; border-bottom: none;
            border-radius: 100px 100px 0 0; display: flex; align-items: flex-end;
            justify-content: center; background: rgba(0,0,0,0.2); position: relative;
        }
        .gauge-val { font-size: 0.9rem; font-weight: bold; margin-bottom: 2px; }
        .gauge-label { font-size: 0.55rem; text-transform: uppercase; margin-top: 5px; color: var(--primary); }

        .math-area { font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 900; text-align: right; margin: 15px 0; }
        
        .digit-input { 
            width: 40px; height: 50px; font-size: 1.8rem; text-align: center; 
            border-radius: 8px; border: 2px solid var(--primary);
            background: rgba(0,0,0,0.5); color: white; margin: 0 2px;
            display: inline-block; vertical-align: middle; line-height: 50px;
        }

        .area-table { width: 100%; border-collapse: separate; border-spacing: 5px; margin-top: 10px; }
        .area-table td { border: 2px solid var(--primary); padding: 8px; border-radius: 8px; background: rgba(0,0,0,0.3); min-width: 40px; }
        .area-label { border: none !important; background: none !important; color: var(--accent); font-size: 1rem; text-align: center; }
        .area-input { width: 100%; background: transparent; border: none; color: white; text-align: center; font-size: 1rem; font-family: inherit; }

        .leaderboard-card { 
            background: rgba(0,0,0,0.3); border-radius: 20px; padding: 15px; 
            margin-top: 20px; border: 1px solid var(--primary); width: 100%; box-sizing: border-box;
        }
        .lb-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .lb-table th { color: var(--primary); border-bottom: 1px solid #444; padding: 5px; text-align: left; }
        .lb-table td { padding: 8px 5px; border-bottom: 1px solid #222; }

        #auth-overlay, #admin-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .modal-card { background: var(--card-bg); padding: 25px; border-radius: 25px; border: 2px solid var(--primary); width: 85%; max-width: 380px; text-align: center; }
        
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid var(--primary); background: #0f3460; color: white; box-sizing: border-box; text-align: center; }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-link { background: none; color: var(--primary); border: none; text-decoration: underline; cursor: pointer; font-size: 0.85rem; padding: 12px; }

        .hidden { display: none !important; }

        /* --- UPDATED CERTIFICATE STYLES --- */
        #cert-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px); overflow-y: auto; }
        .cert-container {
            background: #fff; width: 800px; height: 565px; padding: 40px; border: 15px solid #b38728;
            position: relative; color: #1a1a2e; box-sizing: border-box; text-align: center;
            display: flex; flex-direction: column; justify-content: center;
        }
        .cert-title { font-family: 'Georgia', serif; font-size: 2.5rem; color: #8a6e2f; margin: 5px 0; font-weight: 900; }
        .cert-name { font-family: 'Brush Script MT', cursive; font-size: 3rem; border-bottom: 2px solid #b38728; display: inline-block; min-width: 60%; margin: 10px 0; }
        
        /* Trophy Positions: Upper Right and Left Corners */
        .cert-trophy-ur { position: absolute; top: 20px; right: 20px; font-size: 60px; }
        .cert-trophy-ul { position: absolute; top: 20px; left: 20px; font-size: 60px; }

        .cert-footer { 
            display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: flex-end; 
            margin-top: 30px; font-size: 0.7rem; color: #444; width: 100%;
        }
        /* QR in Middle of Footer */
        .qr-center { display: flex; justify-content: center; align-items: center; }
        .cert-qr-img { width: 70px; height: 70px; border: 1px solid #eee; background: white; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="modal-card">
            <h2 id="auth-title" style="color:var(--primary);">QUEST LOGIN</h2>
            <div id="auth-inputs">
                <input type="email" id="user-email" placeholder="Email Address">
                <input type="password" id="user-pass" placeholder="Password">
            </div>
            <button class="btn btn-primary" id="btn-auth-action">SIGN IN</button>
            <div id="auth-toggles"><button class="btn-link" onclick="window.setAuthState('signup')">Sign Up</button></div>
        </div>
    </div>

    <div id="cert-overlay" class="hidden">
        <div class="cert-container" id="printable-cert">
            <div class="cert-trophy-ul">🏆</div>
            <div class="cert-trophy-ur">🏆</div>
            <p style="color: #b38728; font-weight: bold;">CERTIFICATE OF MASTERY</p>
            <h1 class="cert-title">Math World 3D</h1>
            <div class="cert-name" id="cert-student-name">EXPLORER</div>
            <p id="cert-op-name" style="font-weight:bold; color:#b38728;">MULTIPLICATION MASTERY</p>
            
            <div class="cert-footer">
                <div style="text-align: left;">
                    <p><strong>ID:</strong> <span id="cert-id"></span></p>
                    <p><strong>Date:</strong> <span id="cert-date"></span></p>
                </div>
                <div class="qr-center">
                    <img id="cert-qr" class="cert-qr-img" src="">
                </div>
                <div style="text-align: right;">
                    <p>Digitally Signed By:<br><strong>Mohammad Ashraf Rather</strong></p>
                </div>
            </div>
        </div>
        <button class="btn btn-primary" style="width:200px;" onclick="window.downloadCertificate()">DOWNLOAD</button>
        <button class="btn-link" onclick="document.getElementById('cert-overlay').classList.add('hidden')" style="color:white;">Close</button>
    </div>

    <header style="width: 95%; max-width: 500px; display: flex; justify-content: space-between; padding: 10px 0;">
        <div id="player-name">Explorer</div>
        <button onclick="window.logout()" style="background:#ff4757; color:white; border:none; border-radius:5px; padding:5px 10px;">LOGOUT</button>
    </header>

    <div class="main-wrapper">
        <div class="dashboard">
            <div class="gauge-box"><div class="gauge"><span class="gauge-val" id="q-timer">80</span></div><div class="gauge-label">Quest</div></div>
            <div class="gauge-box"><div class="gauge"><span class="gauge-val" id="points">0</span></div><div class="gauge-label">Points</div></div>
        </div>

        <div class="container">
            <div class="math-area" id="math-display"></div>
            <div id="feedback" style="text-align:center; color:var(--accent);"></div>
            <button class="btn btn-primary" id="submit-btn">SUBMIT ANSWER</button>
            <button class="btn hidden" id="next-btn" style="background:var(--secondary)">NEXT QUEST ➔</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyC6FbPb36F69k7cw_tLbGQoVQxs6shzfAo", authDomain: "math-world-3d.firebaseapp.com", projectId: "math-world-3d" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let userData = { currentStep: 0, points: 0 };
    let currentAns = "";
    let areaData = {};

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.getElementById("auth-overlay").classList.add("hidden");
            const snap = await getDoc(doc(db, "users", user.uid));
            if (snap.exists()) userData = snap.data();
            generateQuestion();
        } else {
            document.getElementById("auth-overlay").classList.remove("hidden");
        }
    });

    function generateQuestion() {
        const display = document.getElementById("math-display");
        const step = userData.currentStep || 0;
        let n1, n2;

        // Toggle between 3x2 and 3x4
        if (step % 2 === 0) {
            n1 = Math.floor(Math.random() * 900) + 100; // 3-digit
            n2 = Math.floor(Math.random() * 90) + 10;   // 2-digit
        } else {
            n1 = Math.floor(Math.random() * 900) + 100;   // 3-digit
            n2 = Math.floor(Math.random() * 9000) + 1000; // 4-digit
        }
        
        currentAns = (n1 * n2).toString();
        renderAreaModel(n1, n2);
    }

    function renderAreaModel(n1, n2) {
        const d1 = n1.toString().split('').map(Number);
        const d2 = n2.toString().split('').map(Number);
        
        // Setup table headers (Expanded numbers: e.g., 300, 20, 5)
        let headerRow = `<td class="area-label">×</td>`;
        d1.forEach((d, i) => {
            headerRow += `<td class="area-label">${d * Math.pow(10, d1.length - 1 - i)}</td>`;
        });

        let bodyRows = "";
        d2.forEach((d, j) => {
            let row = `<tr><td class="area-label">${d * Math.pow(10, d2.length - 1 - j)}</td>`;
            d1.forEach(() => {
                row += `<td><input type="number" class="area-input" placeholder=""></td>`;
            });
            row += `</tr>`;
            bodyRows += row;
        });

        document.getElementById("math-display").innerHTML = `
            <div style="font-size:1.2rem; text-align:center; color:var(--primary);">${n1} × ${n2}</div>
            <table class="area-table"><tr>${headerRow}</tr>${bodyRows}</table>
            <div style="margin-top:15px; text-align:center;" id="ans-box"></div>
        `;

        const ansBox = document.getElementById("ans-box");
        for (let i = 0; i < currentAns.length; i++) {
            ansBox.innerHTML += `<input type="number" class="digit-input" maxlength="1">`;
        }
    }

    document.getElementById("submit-btn").onclick = async () => {
        let userAns = "";
        document.querySelectorAll(".digit-input").forEach(i => userAns += i.value);
        
        if (userAns === currentAns) {
            userData.points += 10;
            userData.currentStep++;
            await updateDoc(doc(db, "users", auth.currentUser.uid), userData);
            document.getElementById("feedback").innerText = "CORRECT! +10 Points";
            confetti();
            if (userData.currentStep % 5 === 0) showCert();
            generateQuestion();
        } else {
            document.getElementById("feedback").innerText = "TRY AGAIN!";
        }
    };

    function showCert() {
        document.getElementById("cert-id").innerText = "MW-" + Math.floor(Math.random()*10000);
        document.getElementById("cert-date").innerText = new Date().toLocaleDateString();
        document.getElementById("cert-qr").src = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=MathWorldMastery`;
        document.getElementById("cert-overlay").classList.remove("hidden");
    }

    window.downloadCertificate = () => {
        html2canvas(document.getElementById('printable-cert')).then(canvas => {
            const link = document.createElement('a');
            link.download = 'Mastery_Certificate.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    };

    window.logout = () => signOut(auth).then(() => location.reload());
</script>
</body>
</html>
