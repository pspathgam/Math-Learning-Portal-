<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math World 3D: Ultimate Quest</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --primary: #00d2ff; 
            --secondary: #00ff88; 
            --accent: #ffd700; 
            --bg: #1a1a2e;
            --card-bg: #16213e;
            --text: #ffffff; 
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            color: var(--text); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }

        /* 3D Perspective Layout */
        .main-wrapper {
            perspective: 1000px;
            width: 95%;
            max-width: 500px;
            margin-top: 20px;
        }

        .container { 
            background: rgba(255,255,255,0.05); 
            padding: 25px; 
            border-radius: 30px; 
            border: 1px solid rgba(255,255,255,0.1);
            transform: rotateX(3deg);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .container:hover { transform: rotateX(0deg); }

        /* Half-Circular Gauges */
        .dashboard { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px; 
            margin-bottom: 20px;
        }
        .gauge-box { text-align: center; }
        .gauge {
            height: 45px;
            border: 4px solid #333;
            border-bottom: none;
            border-radius: 100px 100px 0 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: rgba(0,0,0,0.2);
            position: relative;
        }
        .gauge-val { font-size: 0.9rem; font-weight: bold; margin-bottom: 2px; }
        .gauge-label { font-size: 0.55rem; text-transform: uppercase; margin-top: 5px; color: var(--primary); }

        /* Math Area */
        .math-area { font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 900; text-align: right; margin: 15px 0; }
        .digit-input { 
            width: 40px; height: 55px; font-size: 1.8rem; text-align: center; 
            border-radius: 10px; border: 2px solid var(--primary);
            background: rgba(0,0,0,0.5); color: white; margin: 0 2px;
            box-shadow: inset 0 0 10px rgba(0,210,255,0.2);
        }
        .digit-input:focus { outline: none; border-color: var(--secondary); box-shadow: 0 0 15px var(--primary); }

        /* Auth UI */
        #auth-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .auth-card { background: var(--card-bg); padding: 30px; border-radius: 25px; border: 2px solid var(--primary); width: 90%; max-width: 380px; text-align: center; }
        .auth-card input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--primary); background: #0f3460; color: white; box-sizing: border-box; text-align: center; }
        
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-link { background: none; color: var(--primary); border: none; text-decoration: underline; font-size: 0.8rem; cursor: pointer; margin-top: 10px; }
        .btn-next { background: var(--secondary); color: #000; }
        
        .trophy-shelf { display: flex; justify-content: center; gap: 15px; margin-bottom: 10px; font-size: 1.5rem; }
        .trophy { filter: grayscale(1); opacity: 0.3; transition: 0.5s; }
        .trophy.active { filter: grayscale(0); opacity: 1; transform: scale(1.2); }

        .designer-box { margin-top: 30px; padding: 20px; display: flex; align-items: center; justify-content: center; gap: 15px; border-top: 1px solid rgba(255,255,255,0.1); width: 100%; }
        .designer-photo { width: 60px; height: 60px; border-radius: 15px; border: 2px solid var(--primary); object-fit: cover; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2 id="auth-title" style="color:var(--primary)">QUEST LOGIN</h2>
            <p id="auth-desc" style="font-size: 0.8rem; color: #888;">Enter the math dimension</p>
            
            <div id="auth-inputs">
                <input type="email" id="user-email" placeholder="Email Address">
                <input type="password" id="user-pass" placeholder="Password">
            </div>

            <button class="btn btn-primary" id="btn-auth-action">SIGN IN</button>
            
            <div id="auth-toggles">
                <button class="btn-link" onclick="setAuthState('signup')">Create Account</button> | 
                <button class="btn-link" onclick="setAuthState('forgot')">Forgot Password?</button>
            </div>
            <button id="btn-back-to-login" class="btn-link hidden" onclick="setAuthState('signin')">Back to Sign In</button>
        </div>
    </div>

    <header style="width: 95%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; padding: 15px 0;">
        <div style="display:flex; align-items:center; gap:10px;">
            <img id="user-photo" src="https://via.placeholder.com/50" style="width:45px; height:45px; border-radius:50%; border:2px solid var(--primary); cursor:pointer;" onclick="toggleUserMenu()">
            <div>
                <div id="player-name" style="font-weight:bold; font-size:0.9rem;">Explorer</div>
                <div id="level-tag" style="font-size:0.6rem; color:var(--secondary);">LEVEL 1: ADDITION</div>
            </div>
        </div>
        <button onclick="logout()" style="background:#ff4757; color:white; border:none; padding:5px 10px; border-radius:5px; font-size:0.7rem;">LOGOUT</button>
    </header>

    <div class="main-wrapper">
        <div class="dashboard">
            <div class="gauge-box">
                <div class="gauge" style="border-top-color: var(--primary);"><span class="gauge-val" id="q-timer">80</span></div>
                <div class="gauge-label">Quest</div>
            </div>
            <div class="gauge-box">
                <div class="gauge" style="border-top-color: var(--secondary);"><span class="gauge-val" id="total-time">0</span></div>
                <div class="gauge-label">Total</div>
            </div>
            <div class="gauge-box">
                <div class="gauge" style="border-top-color: var(--accent);"><span class="gauge-val" id="points">0</span></div>
                <div class="gauge-label">Points</div>
            </div>
            <div class="gauge-box">
                <div class="gauge" style="border-top-color: #ff4757;"><span class="gauge-val" id="correct-count">0</span></div>
                <div class="gauge-label">Correct</div>
            </div>
        </div>

        <div class="container">
            <div class="trophy-shelf">
                <span class="trophy" id="t-bronze">🥉</span>
                <span class="trophy" id="t-silver">🥈</span>
                <span class="trophy" id="t-gold">🥇</span>
            </div>

            <div class="math-area">
                <div id="n1">0</div>
                <div style="display:flex; justify-content: space-between;"><span style="color:var(--secondary)" id="op">+</span><span id="n2">0</span></div>
                <hr style="border:1px solid #333">
                <div id="ans-box" style="display:flex; justify-content: flex-end;"></div>
            </div>

            <div id="feedback" style="text-align:center; height: 25px; font-weight:bold; color:var(--accent); font-size: 0.9rem;"></div>
            <button class="btn btn-primary" id="submit-btn">SUBMIT ANSWER</button>
            <button class="btn btn-next hidden" id="next-btn">NEXT QUEST ➔</button>
        </div>
    </div>

    <div class="designer-box">
        <img src="IMG_20221004_191436.jpg" alt="Mohammad Ashraf Rather" class="designer-photo">
        <div style="text-align: left;">
            <p style="font-weight: bold; color: var(--primary); margin: 0; font-size: 1rem;">Mohammad Ashraf Rather</p>
            <p style="font-size: 0.7rem; color: #888; margin: 2px 0; text-transform: uppercase;">Designer & Architect</p>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut, updatePassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC6FbPb36F69k7cw_tLbGQoVQxs6shzfAo",
      authDomain: "math-world-3d.firebaseapp.com",
      projectId: "math-world-3d",
      storageBucket: "math-world-3d.firebasestorage.app",
      messagingSenderId: "526717782686",
      appId: "1:526717782686:web:21dddbcb293323eda8098f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let userData = { currentStep: 0, correctTotal: 0, totalSeconds: 0, points: 0, photoURL: "" };
    let currentAns = "", attempts = 0, qTimerVal = 80, authState = 'signin';
    let qInterval, tInterval;

    // --- Auth UI Management ---
    window.setAuthState = (state) => {
        authState = state;
        const title = document.getElementById('auth-title');
        const desc = document.getElementById('auth-desc');
        const btn = document.getElementById('btn-auth-action');
        const passInput = document.getElementById('user-pass');
        const toggles = document.getElementById('auth-toggles');
        const backBtn = document.getElementById('btn-back-to-login');

        backBtn.classList.toggle('hidden', state === 'signin');
        toggles.classList.toggle('hidden', state !== 'signin');

        if (state === 'signin') {
            title.innerText = "QUEST LOGIN";
            desc.innerText = "Enter the math dimension";
            btn.innerText = "SIGN IN";
            passInput.classList.remove('hidden');
        } else if (state === 'signup') {
            title.innerText = "NEW EXPLORER";
            desc.innerText = "Join the 3D math quest";
            btn.innerText = "CREATE ACCOUNT";
            passInput.classList.remove('hidden');
        } else if (state === 'forgot') {
            title.innerText = "RECOVER KEY";
            desc.innerText = "Send reset link to email";
            btn.innerText = "SEND RESET LINK";
            passInput.classList.add('hidden');
        }
    };

    document.getElementById('btn-auth-action').onclick = async () => {
        const email = document.getElementById('user-email').value;
        const pass = document.getElementById('user-pass').value;

        try {
            if (authState === 'signin') {
                await signInWithEmailAndPassword(auth, email, pass);
            } else if (authState === 'signup') {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await setDoc(doc(db, "users", res.user.uid), userData);
            } else if (authState === 'forgot') {
                await sendPasswordResetEmail(auth, email);
                alert("Reset link sent to your email!");
                setAuthState('signin');
            }
        } catch (e) { alert(e.message); }
    };

    window.toggleUserMenu = () => {
        const choice = prompt("Choose Action:\n1. Update Photo\n2. Change Password");
        if (choice === "1") updatePhoto();
        if (choice === "2") changeUserPassword();
    };

    async function changeUserPassword() {
        const newPass = prompt("Enter new password:");
        if (newPass && newPass.length >= 6) {
            try {
                await updatePassword(auth.currentUser, newPass);
                alert("Password updated successfully!");
            } catch (e) { alert("Please logout and login again to change password (Security Requirement)"); }
        }
    }

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.getElementById('auth-overlay').classList.add('hidden');
            const snap = await getDoc(doc(db, "users", user.uid));
            if (snap.exists()) userData = snap.data();
            updateUI();
            generateQuestion();
            startTotalTimer();
        }
    });

    // --- Existing Game Engine Functions ---
    // (Retained from previous build: generateQuestion, setupInputs, updateUI, rand, etc.)
    // ... [Include generateQuestion and setupInputs logic from the previous code block here] ...

    window.logout = () => signOut(auth).then(() => location.reload());

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function generateQuestion() {
        attempts = 0; qTimerVal = 80;
        document.getElementById('feedback').innerText = "";
        document.getElementById('submit-btn').classList.remove('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        const level = Math.floor(userData.currentStep / 30) + 1;
        let n1, n2, op = "+", ans;
        if (level === 1) { n1 = rand(100, 999); n2 = rand(100, 999); ans = n1 + n2; }
        else if (level <= 4) { n1 = rand(500, 999); n2 = rand(100, 499); op = "-"; ans = n1 - n2; }
        else { n1 = rand(2, 9); n2 = rand(2, 9); op = "×"; ans = n1 * n2; }
        currentAns = ans.toString();
        document.getElementById('n1').innerText = n1; document.getElementById('n2').innerText = n2; document.getElementById('op').innerText = op;
        document.getElementById('level-tag').innerText = `LEVEL ${level} (Quest ${userData.currentStep % 30 + 1}/30)`;
        setupInputs(currentAns.length);
        startQuestTimer();
    }

    function setupInputs(len) {
        const box = document.getElementById('ans-box'); box.innerHTML = "";
        for(let i=0; i<len; i++) {
            const inp = document.createElement('input'); inp.type = "number"; inp.className = "digit-input";
            inp.oninput = function() { if(this.value.length > 0) { this.value = this.value.slice(-1); if(this.previousElementSibling) this.previousElementSibling.focus(); } };
            box.appendChild(inp);
        }
        box.lastElementChild.focus();
    }

    document.getElementById('submit-btn').onclick = () => {
        let userAns = ""; document.querySelectorAll('.digit-input').forEach(i => userAns += i.value);
        if (userAns === currentAns) {
            clearInterval(qInterval); clearInterval(tInterval);
            const earn = (attempts === 0) ? 10 : 5;
            userData.points += earn; userData.correctTotal++;
            document.getElementById('feedback').innerText = `✅ EXCELLENT! +${earn} COINS`;
            confetti(); finishQuest();
        } else {
            attempts++;
            if (attempts >= 2) { clearInterval(qInterval); clearInterval(tInterval); document.getElementById('feedback').innerText = "❌ FAILED"; finishQuest(); }
            else { document.getElementById('feedback').innerText = "❌ TRY AGAIN"; }
        }
    };

    function finishQuest() { document.getElementById('submit-btn').classList.add('hidden'); document.getElementById('next-btn').classList.remove('hidden'); updateUI(); }

    document.getElementById('next-btn').onclick = async () => {
        userData.currentStep++; await updateDoc(doc(db, "users", auth.currentUser.uid), userData);
        generateQuestion(); startTotalTimer();
    };

    function startQuestTimer() {
        clearInterval(qInterval);
        qInterval = setInterval(() => { qTimerVal--; document.getElementById('q-timer').innerText = qTimerVal; if(qTimerVal <= 0) document.getElementById('submit-btn').click(); }, 1000);
    }

    function startTotalTimer() {
        clearInterval(tInterval);
        tInterval = setInterval(() => { userData.totalSeconds++; document.getElementById('total-time').innerText = userData.totalSeconds; }, 1000);
    }

    function updateUI() {
        document.getElementById('points').innerText = userData.points;
        document.getElementById('correct-count').innerText = userData.correctTotal;
        document.getElementById('user-photo').src = userData.photoURL || "https://via.placeholder.com/50";
        if(userData.points >= 1200) document.getElementById('t-bronze').classList.add('active');
        if(userData.points >= 2400) document.getElementById('t-silver').classList.add('active');
        if(userData.points >= 3600) document.getElementById('t-gold').classList.add('active');
    }

    window.updatePhoto = async () => {
        const url = prompt("Enter Image URL:");
        if(url) { userData.photoURL = url; await updateDoc(doc(db, "users", auth.currentUser.uid), { photoURL: url }); updateUI(); }
    };
</script>
</body>
</html>
