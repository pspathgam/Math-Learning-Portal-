<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math World 3D: Ultimate Quest</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #00d2ff; --secondary: #00ff88; --accent: #ffd700; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; margin: 0; color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(10px); }
        .auth-card { background: #16213e; padding: 30px; border-radius: 25px; border: 2px solid var(--primary); width: 90%; max-width: 380px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--primary); background: #0f3460; color: white; box-sizing: border-box; text-align: center; font-size: 16px; }
        
        .dashboard { display: flex; justify-content: space-around; width: 100%; max-width: 500px; margin-top: 15px; }
        .clock-container { text-align: center; width: 30%; }
        .speed-clock { 
            width: 80px; height: 80px; border-radius: 50%; 
            border: 4px solid #333; border-top: 4px solid var(--primary);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(#16213e, #0b0e14); margin: 0 auto;
            position: relative; box-shadow: 0 0 15px rgba(0,210,255,0.3);
        }
        .clock-val { font-size: 1.2rem; font-weight: bold; }
        .clock-label { font-size: 0.6rem; text-transform: uppercase; color: var(--primary); margin-top: 5px; }

        .level-navigator { width: 95%; max-width: 500px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 15px; margin-top: 15px; overflow-x: auto; white-space: nowrap; display: flex; gap: 8px; border: 1px solid #444; }
        .nav-dot { min-width: 35px; height: 35px; border-radius: 8px; background: #333; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; cursor: pointer; border: 1px solid #555; }
        .nav-dot.active { background: var(--primary); color: #000; font-weight: bold; border-color: white; }
        .nav-dot.completed { background: var(--secondary); color: #000; }

        .container { width: 95%; max-width: 500px; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.2); margin-top: 15px; }
        .math-area { font-size: clamp(2.5rem, 10vw, 4rem); font-weight: 900; text-align: right; margin: 15px 0; }
        .digit-input { width: 45px; height: 65px; font-size: 2rem; text-align: center; margin: 0 4px; border-radius: 12px; border: 2px solid var(--primary); background: rgba(0,0,0,0.4); color: white; }
        
        /* Leaderboard Styling */
        .leaderboard-container { width: 95%; max-width: 500px; background: rgba(0,0,0,0.4); margin-top: 20px; border-radius: 20px; border: 1px solid var(--primary); padding: 15px; }
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .leaderboard-table th { color: var(--primary); text-align: left; font-size: 0.8rem; padding-bottom: 10px; border-bottom: 1px solid #333; }
        .leaderboard-table td { padding: 10px 0; border-bottom: 1px solid #222; font-size: 0.9rem; }
        .rank-gold { color: var(--accent); font-weight: bold; }

        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-logout { background: #ff4757; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }
        
        .designer-box { 
            margin-top: 30px; padding: 20px; 
            display: flex; align-items: center; justify-content: center;
            border-top: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 500px; gap: 15px;
        }
        .designer-photo { width: 70px; height: 70px; border-radius: 15px; border: 2px solid var(--primary); object-fit: cover; }
        .designer-info { text-align: left; }
        .designer-name { font-weight: bold; color: var(--primary); margin: 0; font-size: 1.1rem; }
        .designer-title { font-size: 0.8rem; color: #888; margin: 2px 0; text-transform: uppercase; letter-spacing: 1px; }

        .hidden { display: none !important; }
        #recaptcha-container { margin: 10px 0; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2 style="color:var(--primary)">MATH WORLD 3D</h2>
            <p id="auth-status">Login to Save Progress</p>
            <div id="phone-box">
                <input type="tel" id="phone-number" placeholder="Mobile Number" value="+919596449881">
                <div id="recaptcha-container"></div>
                <button class="btn btn-primary" id="btn-send-otp">Send SMS OTP</button>
            </div>
            <div id="otp-box" class="hidden">
                <input type="text" id="otp-code" placeholder="6-digit OTP">
                <button class="btn btn-primary" id="btn-verify-otp">Verify & Start</button>
            </div>
        </div>
    </div>

    <div style="width: 95%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
        <h1 style="margin: 0; font-size: 1.5rem;">QUEST <span id="q-num">1</span></h1>
        <button class="btn-logout" id="btn-logout">LOGOUT</button>
    </div>

    <div class="dashboard">
        <div class="clock-container">
            <div class="speed-clock" id="timer-clock"><span class="clock-val" id="q-timer">80</span></div>
            <div class="clock-label">Quest Time</div>
        </div>
        <div class="clock-container">
            <div class="speed-clock" style="border-top-color: var(--secondary);"><span class="clock-val" id="total-time">0</span></div>
            <div class="clock-label">Total Time</div>
        </div>
        <div class="clock-container">
            <div class="speed-clock" style="border-top-color: var(--accent);"><span class="clock-val" id="correct-count">0</span></div>
            <div class="clock-label">Points</div>
        </div>
    </div>

    <div class="level-navigator" id="level-nav"></div>

    <div class="container">
        <div id="level-title" style="color: var(--secondary); font-weight: bold; text-align: center; text-transform: uppercase;">LOADING...</div>
        <div class="math-area">
            <div id="n1">0</div>
            <div style="display:flex; justify-content: space-between;"><span style="color:var(--secondary)" id="op">+</span><span id="n2">0</span></div>
            <hr>
            <div id="ans-box" style="display:flex; justify-content: flex-end;"></div>
        </div>
        <div id="feedback" style="text-align:center; height: 25px; font-weight:bold; color:var(--accent)"></div>
        <button class="btn btn-primary" id="submit-btn">SUBMIT ANSWER</button>
        <button class="btn btn-primary hidden" id="next-btn">NEXT QUEST ➔</button>
    </div>

    <div class="leaderboard-container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin:0; color:var(--primary); font-size: 1rem;">WORLD LEADERBOARD</h3>
            <span id="user-rank" style="font-size: 0.7rem; color: var(--secondary);">Calculating Rank...</span>
        </div>
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>RANK</th>
                    <th>PLAYER</th>
                    <th style="text-align: right;">POINTS</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                </tbody>
        </table>
    </div>

    <div class="designer-box">
        <img src="IMG_20221004_191436.jpg" alt="Mohammad Ashraf Rather" class="designer-photo">
        <div class="designer-info">
            <p class="designer-name">Mohammad Ashraf Rather</p>
            <p class="designer-title">Designer & Architect</p>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC6FbPb36F69k7cw_tLbGQoVQxs6shzfAo",
      authDomain: "math-world-3d.firebaseapp.com",
      projectId: "math-world-3d",
      storageBucket: "math-world-3d.firebasestorage.app",
      messagingSenderId: "526717782686",
      appId: "1:526717782686:web:21dddbcb293323eda8098f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentStep = 0, currentCorrectAns = 0, confirmationResult;
    let questSeconds = 80, totalSeconds = 0, correctTotal = 0;
    let timerInterval, totalTimeInterval;

    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { 'size': 'invisible' });

    document.getElementById('btn-send-otp').onclick = async () => {
        let phone = document.getElementById('phone-number').value.trim();
        if (!phone.startsWith('+')) phone = "+91" + phone;
        try {
            confirmationResult = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);
            document.getElementById('phone-box').classList.add('hidden');
            document.getElementById('otp-box').classList.remove('hidden');
        } catch (e) { alert("Auth Error: " + e.message); }
    };

    document.getElementById('btn-verify-otp').onclick = async () => {
        try { await confirmationResult.confirm(document.getElementById('otp-code').value); } catch (e) { alert("Invalid OTP"); }
    };

    document.getElementById('btn-logout').onclick = async () => { await signOut(auth); location.reload(); };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.getElementById('auth-overlay').classList.add('hidden');
            const snap = await getDoc(doc(db, "users", user.uid));
            if (snap.exists()) {
                currentStep = snap.data().currentStep || 0;
                correctTotal = snap.data().correctTotal || 0;
                totalSeconds = snap.data().totalSeconds || 0;
            }
            updateNavigator();
            startTotalTimer();
            generateQuestion();
            fetchLeaderboard();
        }
    });

    async function fetchLeaderboard() {
        const q = query(collection(db, "users"), orderBy("correctTotal", "desc"), limit(5));
        const querySnapshot = await getDocs(q);
        const list = document.getElementById('leaderboard-body');
        list.innerHTML = "";
        
        let rank = 1;
        querySnapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const row = `<tr>
                <td class="${rank === 1 ? 'rank-gold' : ''}">#${rank}</td>
                <td>Player ${docSnap.id.substring(0, 5)}</td>
                <td style="text-align: right; font-weight: bold; color: var(--secondary);">${(data.correctTotal || 0) * 10}</td>
            </tr>`;
            list.innerHTML += row;
            if (auth.currentUser && docSnap.id === auth.currentUser.uid) {
                document.getElementById('user-rank').innerText = `Your Rank: #${rank}`;
            }
            rank++;
        });
    }

    function updateNavigator() {
        const nav = document.getElementById('level-nav'); nav.innerHTML = "";
        for(let i=1; i<=13; i++) {
            const dot = document.createElement('div');
            const levelStart = (i-1) * 30;
            dot.className = "nav-dot " + (currentStep >= levelStart + 30 ? 'completed' : (currentStep >= levelStart ? 'active' : ''));
            dot.innerText = i;
            nav.appendChild(dot);
        }
    }

    function startTotalTimer() {
        if (totalTimeInterval) clearInterval(totalTimeInterval);
        totalTimeInterval = setInterval(() => { totalSeconds++; document.getElementById('total-time').innerText = totalSeconds; }, 1000);
    }

    function startQuestTimer() {
        questSeconds = 80; document.getElementById('q-timer').innerText = questSeconds;
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            questSeconds--; document.getElementById('q-timer').innerText = questSeconds;
            if (questSeconds <= 0) clearInterval(timerInterval);
        }, 1000);
    }

    function generateQuestion() {
        startQuestTimer();
        document.getElementById('feedback').innerText = "";
        document.getElementById('submit-btn').classList.remove('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('correct-count').innerText = correctTotal * 10;
        
        let n1 = Math.floor(Math.random()*500), n2 = Math.floor(Math.random()*400);
        currentCorrectAns = n1 + n2; 

        document.getElementById('n1').innerText = n1;
        document.getElementById('n2').innerText = n2;
        document.getElementById('op').innerText = "+";
        document.getElementById('level-title').innerText = "Addition Easy";
        document.getElementById('q-num').innerText = currentStep + 1;

        const box = document.getElementById('ans-box'); box.innerHTML = "";
        const digits = currentCorrectAns.toString().length;
        for(let i=0; i<digits; i++) {
            const inp = document.createElement('input'); 
            inp.type = "number"; inp.className = "digit-input";
            inp.oninput = function() { 
                if(this.value.length > 0) { 
                    this.value = this.value.slice(-1); 
                    if(this.previousElementSibling) this.previousElementSibling.focus(); 
                } 
            };
            box.appendChild(inp);
        }
        box.lastElementChild.focus(); 
    }

    document.getElementById('submit-btn').onclick = () => {
        let userAns = "";
        document.querySelectorAll('.digit-input').forEach(i => userAns += i.value);

        if (userAns == currentCorrectAns.toString() && questSeconds > 0) {
            clearInterval(timerInterval);
            correctTotal++;
            document.getElementById('feedback').innerText = "✅ EXCELLENT!";
            document.getElementById('submit-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
            confetti();
            fetchLeaderboard(); // Update rankings immediately
        } else { document.getElementById('feedback').innerText = "❌ TRY AGAIN"; }
    };

    document.getElementById('next-btn').onclick = async () => {
        currentStep++; updateNavigator();
        if (auth.currentUser) await setDoc(doc(db, "users", auth.currentUser.uid), { currentStep, correctTotal, totalSeconds }, { merge: true });
        generateQuestion();
    };
</script>
</body>
</html>
