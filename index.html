<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Mastery Challenge</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ecc71;
            --error: #e74c3c;
            --bg: #f0f4f8;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; }

        .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 2px solid #eee; }
        .progress-text { font-weight: bold; color: #666; }
        .coin-display { font-size: 1.2em; font-weight: bold; color: #d4af37; background: #fff9e6; padding: 5px 15px; border-radius: 20px; border: 1px solid #f1c40f; }

        /* Math Display */
        .math-area { font-family: 'Courier New', monospace; font-size: 2.5em; font-weight: bold; text-align: right; display: inline-block; margin: 20px 0; letter-spacing: 5px; line-height: 1.2; }
        .carry-row { display: flex; justify-content: flex-end; margin-bottom: 5px; height: 30px; }
        .carry-box { width: 25px; height: 25px; border: 1px dashed #bbb; margin-left: 5px; font-size: 16px; text-align: center; line-height: 25px; color: var(--primary); border-radius: 4px; outline: none; }
        .line { border-top: 4px solid #333; margin: 10px 0; width: 100%; }

        /* Answer Boxes */
        .answer-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
        .digit-input { width: 45px; height: 55px; font-size: 28px; text-align: center; border: 2px solid #ddd; border-radius: 8px; font-family: inherit; font-weight: bold; background: #fafafa; }
        .digit-input:focus { border-color: var(--primary); background: #fff; outline: none; box-shadow: 0 0 10px rgba(74,144,226,0.2); }

        /* Feedback Popup */
        #feedback { margin-top: 20px; font-weight: bold; font-size: 1.2em; min-height: 1.5em; }
        .msg-success { color: var(--success); }
        .msg-error { color: var(--error); }

        .btn-submit { width: 100%; padding: 15px; font-size: 1.2em; font-weight: bold; color: white; background: var(--primary); border: none; border-radius: 12px; cursor: pointer; margin-top: 25px; transition: 0.3s; }
        .btn-submit:hover { background: #357abd; transform: translateY(-2px); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <div class="progress-text">Question <span id="q-num">1</span> / 100</div>
        <div class="coin-display">💰 <span id="coin-count">0</span></div>
    </div>

    <div id="game-area">
        <div id="carry-container" class="carry-row"></div>
        <div class="math-area">
            <div id="num1">000000</div>
            <div id="op-num2">- 000000</div>
            <div class="line"></div>
            <div id="answer-container" class="answer-row"></div>
        </div>
    </div>

    <div id="feedback"></div>
    <button class="btn-submit" id="submit-btn" onclick="checkAnswer()">SUBMIT ANSWER</button>
    <button class="btn-submit hidden" id="next-btn" onclick="nextQuestion()">NEXT QUESTION ➔</button>
</div>

<script>
    let currentStep = 0; // 0 to 99
    let coins = 0;
    let currentCorrectAns = 0;

    const qNumDisplay = document.getElementById('q-num');
    const coinDisplay = document.getElementById('coin-count');
    const feedback = document.getElementById('feedback');
    const submitBtn = document.getElementById('submit-btn');
    const nextBtn = document.getElementById('next-btn');

    function generateQuestion() {
        feedback.innerHTML = "";
        submitBtn.classList.remove('hidden');
        nextBtn.classList.add('hidden');
        
        const carryRow = document.getElementById('carry-container');
        const answerRow = document.getElementById('answer-container');
        carryRow.innerHTML = "";
        answerRow.innerHTML = "";

        let n1, n2, op, digits;

        if (currentStep < 50) {
            // 6-Digit Subtraction
            n1 = Math.floor(Math.random() * 800000) + 200000;
            n2 = Math.floor(Math.random() * 100000) + 100000;
            op = "-";
            currentCorrectAns = n1 - n2;
            digits = 6;
        } else {
            // Multiplication
            if (currentStep < 75) { // Level 1
                n1 = Math.floor(Math.random() * 90) + 10;
                n2 = Math.floor(Math.random() * 8) + 2;
            } else { // Level 2
                n1 = Math.floor(Math.random() * 90) + 10;
                n2 = Math.floor(Math.random() * 90) + 10;
            }
            op = "×";
            currentCorrectAns = n1 * n2;
            digits = currentCorrectAns.toString().length;
        }

        document.getElementById('num1').innerText = n1;
        document.getElementById('op-num2').innerText = `${op} ${n2}`;

        // Create Carry Boxes
        for (let i = 0; i < digits; i++) {
            carryRow.innerHTML += `<div class="carry-box" contenteditable="true"></div>`;
            answerRow.innerHTML += `<input type="text" maxlength="1" class="digit-input">`;
        }
        
        // Focus first input
        setTimeout(() => document.querySelector('.digit-input').focus(), 100);
    }

    function checkAnswer() {
        const inputs = document.querySelectorAll('.digit-input');
        let userAns = "";
        inputs.forEach(inp => userAns += inp.value);

        if (userAns === "") return alert("Please enter an answer!");

        if (parseInt(userAns) === currentCorrectAns) {
            coins += 5;
            coinDisplay.innerText = coins;
            feedback.innerHTML = '<span class="msg-success">🌟 You are doing wonders! +5 Coins</span>';
            submitBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');
        } else {
            feedback.innerHTML = '<span class="msg-error">❌ Better luck next time! Try again.</span>';
        }
    }

    function nextQuestion() {
        currentStep++;
        if (currentStep < 100) {
            qNumDisplay.innerText = currentStep + 1;
            generateQuestion();
        } else {
            document.getElementById('game-area').innerHTML = "<h1>🏆 Challenge Complete!</h1>";
            feedback.innerHTML = `You earned a total of ${coins} coins!`;
            nextBtn.classList.add('hidden');
        }
    }

    // Initialize
    generateQuestion();
</script>

</body>
</html>
