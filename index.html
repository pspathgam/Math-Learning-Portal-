<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Mastery Dashboard</title>
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #00ff88;
            --accent: #ffd700;
            --error: #ff4d4d;
            --text: #ffffff;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460, #1b1b4b, #2d1b4b);
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
            margin: 0; 
            color: var(--text);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            padding: 10px;
            box-sizing: border-box;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .portal-title {
            font-size: clamp(2rem, 10vw, 4rem);
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            margin: 10px 0;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.8);
        }

        /* LEVEL MOVER / NAVIGATOR */
        .level-mover {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 500px;
        }
        .level-dot {
            padding: 6px 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            color: rgba(255,255,255,0.6);
            cursor: default;
        }
        .level-dot.active {
            background: var(--secondary);
            color: #1a1a2e;
            border-color: var(--secondary);
            box-shadow: 0 0 10px var(--secondary);
        }

        .dashboard {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
        }

        .gauge-container {
            position: relative;
            width: 140px;
            height: 80px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 80px 80px 0 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .gauge-svg { width: 140px; height: 140px; transform: rotate(-180deg); }
        .gauge-bg { fill: none; stroke: rgba(255, 255, 255, 0.1); stroke-width: 10; }
        .gauge-fill { fill: none; stroke-width: 10; stroke-dasharray: 220; stroke-dashoffset: 220; transition: stroke-dashoffset 0.5s ease; stroke-linecap: round; }
        .gauge-label { position: absolute; bottom: 5px; width: 100%; text-align: center; font-size: 0.7rem; opacity: 0.8; font-weight: bold; }
        .gauge-value { position: absolute; bottom: 20px; width: 100%; text-align: center; font-weight: bold; font-size: 1.3rem; color: var(--accent); }

        .container { 
            width: 100%; 
            max-width: 500px; 
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px; 
            border-radius: 35px; 
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3); 
            text-align: center;
            box-sizing: border-box;
        }

        .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .coin-display { font-size: 1.2rem; color: var(--accent); font-weight: bold; }

        .math-area { 
            font-family: 'Courier New', monospace; 
            font-size: clamp(3rem, 14vw, 5.2rem); 
            font-weight: 900; 
            text-align: right; 
            margin: 10px 0; 
            color: #fff;
            letter-spacing: 2px;
            line-height: 1.1;
            display: inline-block;
        }

        .op-row { display: flex; justify-content: space-between; align-items: center; }
        .operator { padding-right: 20px; color: var(--secondary); }
        .digit-row { display: flex; justify-content: flex-end; }
        .carry-box { width: 25px; height: 25px; border: 1.5px dashed var(--primary); margin-left: 5px; color: var(--primary); border-radius: 4px; font-size: 16px; text-align: center; font-weight: bold; }

        .digit-input { 
            width: clamp(35px, 11vw, 55px); 
            height: clamp(55px, 15vw, 75px); 
            font-size: 2.5rem; 
            text-align: center; 
            border: 2px solid rgba(255,255,255,0.3); 
            border-radius: 12px; 
            background: rgba(0,0,0,0.4); 
            color: white; 
            margin: 0 3px;
            font-weight: bold;
        }

        .digit-input:focus { border-color: var(--secondary); outline: none; background: rgba(0,0,0,0.6); }

        /* REDUCED SPACE HERE */
        #feedback { height: 1.2rem; margin: 8px 0; font-weight: bold; font-size: 1.1rem; }

        .btn-submit { 
            width: 100%; padding: 15px; font-size: 1.2rem; font-weight: bold; color: white; 
            background: linear-gradient(45deg, var(--primary), #3a7bd5); 
            border: none; border-radius: 20px; cursor: pointer; margin-top: 5px; /* Reduced margin */
        }

        .developer-credit { margin-top: auto; padding: 15px; font-size: 0.85rem; color: rgba(255,255,255,0.6); text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1 class="portal-title">Math Mastery</h1>

    <div class="level-mover">
        <div id="lvl-1" class="level-dot active">Lvl 1: Sub</div>
        <div id="lvl-2" class="level-dot">Lvl 2: Mix</div>
        <div id="lvl-3" class="level-dot">Lvl 3: Mult</div>
    </div>

    <div class="dashboard">
        <div class="gauge-container">
            <svg class="gauge-svg">
                <circle class="gauge-bg" cx="70" cy="70" r="60"></circle>
                <circle id="timer-fill" class="gauge-fill" cx="70" cy="70" r="60" style="stroke: var(--primary);"></circle>
            </svg>
            <div class="gauge-value" id="timer-text">60</div>
            <div class="gauge-label">Timer</div>
        </div>

        <div class="gauge-container">
            <svg class="gauge-svg">
                <circle class="gauge-bg" cx="70" cy="70" r="60"></circle>
                <circle id="score-fill" class="gauge-fill" cx="70" cy="70" r="60" style="stroke: var(--secondary);"></circle>
            </svg>
            <div class="gauge-value" id="score-text">0</div>
            <div class="gauge-label">Solved</div>
        </div>
    </div>

    <div class="container">
        <div class="header-box">
            <div id="q-label" style="font-size: 0.9rem; font-weight: bold;">Quest: 1/100</div>
            <div class="coin-display">💰 <span id="coin-count">0</span></div>
        </div>

        <div id="game-area" style="text-align: right;">
            <div id="carry-container" class="digit-row"></div>
            <div class="math-area">
                <div id="num1">000000</div>
                <div class="op-row">
                    <span id="operator-sym" class="operator">-</span>
                    <span id="num2">000000</span>
                </div>
                <div style="border-top: 5px solid rgba(255,255,255,0.8); margin: 8px 0; border-radius: 10px;"></div>
                <div id="answer-container" class="digit-row"></div>
            </div>
        </div>

        <div id="feedback"></div>
        <button class="btn-submit" id="submit-btn" onclick="checkAnswer()">SUBMIT ANSWER</button>
        <button class="btn-submit hidden" id="next-btn" onclick="nextQuestion()">NEXT CHALLENGE ➔</button>
    </div>

    <div class="developer-credit">
        Designed and Developed by <br><b>Mohammad Ashraf Rather</b>
    </div>

<script>
    let currentStep = 0, coins = 0, correctCount = 0, currentCorrectAns = 0;
    let timer, timeLeft = 60;
    const maxDash = 188;

    function updateGauges() {
        document.getElementById('timer-fill').style.strokeDashoffset = maxDash - (timeLeft / 60) * maxDash;
        document.getElementById('timer-text').innerText = timeLeft;
        document.getElementById('score-fill').style.strokeDashoffset = maxDash - (correctCount / 100) * maxDash;
        document.getElementById('score-text').innerText = correctCount;
    }

    function startTimer() {
        clearInterval(timer);
        timeLeft = 60;
        updateGauges();
        timer = setInterval(() => {
            timeLeft--;
            updateGauges();
            if (timeLeft <= 0) { clearInterval(timer); nextQuestion(); }
        }, 1000);
    }

    function updateLevelNav() {
        document.querySelectorAll('.level-dot').forEach(dot => dot.classList.remove('active'));
        if (currentStep < 50) document.getElementById('lvl-1').classList.add('active');
        else if (currentStep < 75) document.getElementById('lvl-2').classList.add('active');
        else document.getElementById('lvl-3').classList.add('active');
    }

    function generateQuestion() {
        startTimer();
        updateLevelNav();
        document.getElementById('feedback').innerHTML = "";
        document.getElementById('submit-btn').classList.remove('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        
        const carryRow = document.getElementById('carry-container');
        const answerRow = document.getElementById('answer-container');
        carryRow.innerHTML = ""; answerRow.innerHTML = "";

        let n1, n2, op, digits;
        if (currentStep < 50) {
            n1 = Math.floor(Math.random() * 800000) + 200000;
            n2 = Math.floor(Math.random() * 100000) + 100000;
            op = "-"; currentCorrectAns = n1 - n2; digits = 6;
        } else {
            n1 = Math.floor(Math.random() * 90) + 10;
            n2 = (currentStep < 75) ? Math.floor(Math.random() * 8) + 2 : Math.floor(Math.random() * 90) + 10;
            op = "×"; currentCorrectAns = n1 * n2; digits = currentCorrectAns.toString().length;
        }

        document.getElementById('num1').innerText = n1.toLocaleString();
        document.getElementById('num2').innerText = n2.toLocaleString();
        document.getElementById('operator-sym').innerText = op;

        for (let i = 0; i < digits; i++) {
            carryRow.innerHTML += `<div class="carry-box" contenteditable="true"></div>`;
            const input = document.createElement('input');
            input.type = "number";
            input.className = "digit-input";
            input.oninput = function() {
                if (this.value.length > 0) {
                    this.value = this.value.slice(-1);
                    const prev = this.previousElementSibling;
                    if (prev) prev.focus();
                }
            };
            answerRow.appendChild(input);
        }
        setTimeout(() => {
            const inputs = document.querySelectorAll('.digit-input');
            inputs[inputs.length - 1].focus();
        }, 300);
    }

    function checkAnswer() {
        let userAns = "";
        document.querySelectorAll('.digit-input').forEach(inp => userAns += inp.value);
        if (userAns === "") return;

        clearInterval(timer);
        if (parseInt(userAns) === currentCorrectAns) {
            coins += 5; correctCount++;
            document.getElementById('coin-count').innerText = coins;
            document.getElementById('feedback').innerHTML = '<span style="color:var(--secondary);">🌟 WONDERS!</span>';
            document.getElementById('submit-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
            updateGauges();
        } else {
            document.getElementById('feedback').innerHTML = '<span style="color:var(--error);">❌ WRONG</span>';
            setTimeout(generateQuestion, 1500);
        }
    }

    function nextQuestion() {
        currentStep++;
        if (currentStep < 100) {
            document.getElementById('q-label').innerText = `Quest: ${currentStep + 1}/100`;
            generateQuestion();
        } else {
            clearInterval(timer);
            document.getElementById('game-area').innerHTML = "<h2>🏆 FINISHED!</h2>";
        }
    }

    generateQuestion();
</script>
</body>
</html>
